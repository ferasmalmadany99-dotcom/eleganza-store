openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Eleganza administration API
servers:
  - url: /api
    description: Base API path
security:
  - clerkSession: []
tags:
  - name: health
  - name: session
  - name: dashboard
  - name: products
  - name: inventory
  - name: orders
  - name: customers
  - name: expenses
  - name: staff
  - name: audit
  - name: system
  - name: storefront
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session/me:
    get:
      operationId: getSession
      tags: [session]
      summary: Current authenticated staff profile
      responses:
        "200":
          description: Session profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard KPI summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{id}/report:
    get:
      operationId: getProductReport
      tags: [products]
      summary: Get a product inventory report
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product inventory report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductReport" }
        "404":
          description: Product not found
  /inventory/movements:
    get:
      operationId: listInventoryMovements
      tags: [inventory]
      summary: List inventory movements
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: productId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Inventory movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryMovement" }
    post:
      operationId: createInventoryMovement
      tags: [inventory]
      summary: Record an inventory movement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryMovementInput" }
      responses:
        "201":
          description: Recorded movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryMovement" }
  /inventory/movements/{id}:
    delete:
      operationId: deleteInventoryMovement
      tags: [inventory]
      summary: Delete the latest inventory movement and reverse its stock effect
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Movement deleted
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: invoiceNumber
          in: query
          description: Filter orders by an invoice/order number, including partial matches
          schema: { type: string }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a local order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers summarized from their orders
      responses:
        "200":
          description: Customers derived from order history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
  /customers/{customerId}/orders:
    get:
      operationId: listCustomerOrders
      tags: [customers]
      summary: List a customer's order history
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer purchase history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusUpdate" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expenses
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Expense" }
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Record an expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff
      responses:
        "200":
          description: Staff
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Staff" }
  /storefront/orders:
    post:
      operationId: createStorefrontOrder
      tags: [storefront]
      summary: Create a customer storefront order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorefrontOrderInput" }
      responses:
        "201":
          description: Customer order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: One or more products are no longer available
  /storefront/products:
    get:
      operationId: listStorefrontProducts
      tags: [storefront]
      summary: List active products for the public storefront
      security: []
      responses:
        "200":
          description: Public storefront catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StorefrontProduct" }
  /storefront/access/verify:
    post:
      operationId: verifyStorefrontAccess
      tags: [storefront]
      summary: Verify the shared access code for the Android app
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorefrontAccessCodeInput" }
      responses:
        "200":
          description: Access code accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontAccessVerification" }
        "401":
          description: Access code is invalid
        "503":
          description: Access code is not configured
  /storefront/customers/profile:
    post:
      operationId: createStorefrontCustomerProfile
      tags: [storefront]
      summary: Create or update the signed-in customer's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerProfileInput" }
      responses:
        "201":
          description: Customer profile saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerProfileResult" }
        "401":
          description: A signed-in account is required
        "403":
          description: Email verification is required
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /storefront/customers/me:
    get:
      operationId: getStorefrontCustomerAccount
      tags: [storefront]
      summary: Get the signed-in customer's profile and purchase history
      responses:
        "200":
          description: Customer profile and recent orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorefrontCustomerAccount" }
        "401":
          description: A signed-in account is required
        "403":
          description: A verified customer account is required
  /staff/invitations:
    post:
      operationId: inviteStaff
      tags: [staff]
      summary: Invite a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffInviteInput" }
      responses:
        "201":
          description: Staff invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffInviteResponse" }
  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update staff role or status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffUpdate" }
      responses:
        "200":
          description: Updated staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
  /audit:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit entries
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }
  /system/reset:
    post:
      operationId: resetSystemData
      tags: [system]
      summary: Delete selected operational data while preserving staff and audit records
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemResetInput" }
      responses:
        "200":
          description: Selected data was deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemResetResult" }
  /shopify/sync:
    post:
      operationId: syncShopify
      tags: [products]
      summary: Pull Shopify catalog and inventory mappings
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounting]
      summary: List chart of accounts
      responses:
        "200":
          description: Chart of accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: createAccount
      tags: [accounting]
      summary: Create a chart of accounts entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [accounting]
      summary: Update a chart of accounts entry
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /journal:
    get:
      operationId: listJournalEntries
      tags: [accounting]
      summary: List journal entries
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JournalEntry" }
    post:
      operationId: createJournalEntry
      tags: [accounting]
      summary: Create a balanced journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalEntryInput" }
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    SystemResetInput:
      type: object
      required: [groups, confirmation]
      properties:
        groups:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [products, inventory, orders, expenses, accounting] }
        confirmation: { type: string, enum: [DELETE] }
    SystemResetResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: object
          required: [orders, inventoryMovements, products, expenses, journalEntries]
          properties:
            orders: { type: integer }
            inventoryMovements: { type: integer }
            products: { type: integer }
            expenses: { type: integer }
            journalEntries: { type: integer }
    StaffRole:
      type: string
      enum: [owner, manager, inventory, sales, viewer]
    StaffStatus:
      type: string
      enum: [active, inactive]
    Staff:
      type: object
      required: [id, clerkUserId, displayName, role, permissions, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        displayName: { type: string }
        email: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/StaffRole" }
        permissions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/StaffRole" }
        status: { $ref: "#/components/schemas/StaffStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Session:
      allOf:
        - $ref: "#/components/schemas/Staff"
    StaffUpdate:
      type: object
      properties:
        role: { $ref: "#/components/schemas/StaffRole" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/StaffRole" }
        status: { $ref: "#/components/schemas/StaffStatus" }
        displayName: { type: string }
        email: { type: string }
    StaffInviteInput:
      type: object
      required: [email, displayName, permissions]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 2 }
        permissions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/StaffRole" }
    StaffInviteResponse:
      type: object
      required: [id, email, displayName, role, permissions, status]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/StaffRole" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/StaffRole" }
        status: { type: string, enum: [pending] }
    StorefrontOrderInput:
      type: object
      required: [customerName, customerPhone, customerAddress, customerLocationUrl, paymentMethod, items]
      properties:
        customerName: { type: string, minLength: 2, maxLength: 120, pattern: ".*\\S.*" }
        customerPhone: { type: string, minLength: 5, maxLength: 40, pattern: ".*\\S.*" }
        customerAddress: { type: string, minLength: 5, maxLength: 500, pattern: ".*\\S.*" }
        customerLocationUrl: { type: string, format: uri, minLength: 8, maxLength: 2000, pattern: ".*\\S.*" }
        paymentMethod: { type: string, enum: [cod] }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1, maximum: 99 }
    StorefrontProduct:
      type: object
      required: [id, sku, nameEn, nameAr, category, descriptionEn, descriptionAr, imageUrls, audience, salePriceMinor, quantityOnHand]
      properties:
        id: { type: integer }
        sku: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        category: { type: string }
        descriptionEn: { type: ["string", "null"] }
        descriptionAr: { type: ["string", "null"] }
        imageUrls: { type: array, items: { type: string } }
        audience: { $ref: "#/components/schemas/ProductAudience" }
        salePriceMinor: { type: integer }
        quantityOnHand: { type: integer }
    StorefrontAccessCodeInput:
      type: object
      required: [accessCode]
      properties:
        accessCode: { type: string, minLength: 1, maxLength: 128 }
    StorefrontAccessVerification:
      type: object
      required: [verified]
      properties:
        verified: { type: boolean }
    CustomerProfileInput:
      type: object
      required: [customerName, customerPhone]
      properties:
        customerName: { type: string, minLength: 2, maxLength: 120, pattern: ".*\\S.*" }
        customerPhone: { type: string, minLength: 5, maxLength: 40, pattern: ".*\\S.*" }
    CustomerProfileResult:
      type: object
      required: [id, customerName]
      properties:
        id: { type: integer }
        customerName: { type: string }
    StorefrontCustomerAccount:
      type: object
      required: [profile, orders]
      properties:
        profile: { $ref: "#/components/schemas/StorefrontCustomerProfile" }
        orders:
          type: array
          items: { $ref: "#/components/schemas/StorefrontCustomerOrder" }
    StorefrontCustomerProfile:
      type: object
      required: [customerName, customerPhone, customerEmail, createdAt]
      properties:
        customerName: { type: string }
        customerPhone: { type: ["string", "null"] }
        customerEmail: { type: string, format: email }
        createdAt: { type: ["string", "null"], format: date-time }
    StorefrontCustomerOrder:
      type: object
      required: [id, orderNumber, status, subtotalMinor, shippingMinor, totalMinor, createdAt, items]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        subtotalMinor: { type: integer }
        shippingMinor: { type: integer }
        totalMinor: { type: integer }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/StorefrontCustomerOrderItem" }
    StorefrontCustomerOrderItem:
      type: object
      required: [productName, quantity, unitPriceMinor]
      properties:
        productName: { type: string }
        quantity: { type: integer }
        unitPriceMinor: { type: integer }
    ProductAudience:
      type: string
      enum: [men, women]
    Product:
      type: object
      required: [id, sku, nameEn, nameAr, category, audience, salePriceMinor, costMinor, quantityOnHand, reorderThreshold, imageUrls, active, createdAt, updatedAt]
      properties:
        id: { type: integer }
        sku: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        descriptionEn: { type: ["string", "null"] }
        descriptionAr: { type: ["string", "null"] }
        category: { type: string }
        audience: { $ref: "#/components/schemas/ProductAudience" }
        salePriceMinor: { type: integer }
        costMinor: { type: integer }
        quantityOnHand: { type: integer }
        reorderThreshold: { type: integer }
        imageUrls:
          type: array
          items: { type: string }
        shopifyProductId: { type: ["string", "null"] }
        shopifyVariantId: { type: ["string", "null"] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [sku, nameEn, nameAr, category, audience, salePriceMinor, costMinor, reorderThreshold]
      properties:
        sku: { type: string, minLength: 1 }
        nameEn: { type: string, minLength: 1 }
        nameAr: { type: string }
        descriptionEn: { type: string }
        descriptionAr: { type: string }
        category: { type: string, minLength: 1 }
        audience: { $ref: "#/components/schemas/ProductAudience" }
        salePriceMinor: { type: integer, minimum: 0 }
        costMinor: { type: integer, minimum: 0 }
        quantityOnHand: { type: integer, minimum: 0, default: 0 }
        reorderThreshold: { type: integer, minimum: 0 }
        imageUrls: { type: array, items: { type: string, format: uri } }
        shopifyProductId: { type: string }
        shopifyVariantId: { type: string }
        active: { type: boolean, default: true }
    ProductUpdate:
      type: object
      properties:
        sku: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        descriptionEn: { type: string }
        descriptionAr: { type: string }
        category: { type: string }
        audience: { $ref: "#/components/schemas/ProductAudience" }
        salePriceMinor: { type: integer, minimum: 0 }
        costMinor: { type: integer, minimum: 0 }
        reorderThreshold: { type: integer, minimum: 0 }
        imageUrls: { type: array, items: { type: string, format: uri } }
        shopifyProductId: { type: string }
        shopifyVariantId: { type: string }
        active: { type: boolean }
    ProductReport:
      type: object
      required: [product, summary, movements]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        summary:
          type: object
          required: [movementCount, purchaseQuantity, purchaseCostMinor, returnQuantity, saleQuantity, damageQuantity, adjustmentQuantity, inboundQuantity, outboundQuantity, weightedAverageCostMinor, currentInventoryValueMinor]
          properties:
            movementCount: { type: integer }
            purchaseQuantity: { type: integer }
            purchaseCostMinor: { type: integer }
            returnQuantity: { type: integer }
            saleQuantity: { type: integer }
            damageQuantity: { type: integer }
            adjustmentQuantity: { type: integer }
            inboundQuantity: { type: integer }
            outboundQuantity: { type: integer }
            weightedAverageCostMinor: { type: integer }
            currentInventoryValueMinor: { type: integer }
        movements:
          type: array
          items: { $ref: "#/components/schemas/ProductReportMovement" }
    ProductReportMovement:
      allOf:
        - $ref: "#/components/schemas/InventoryMovement"
        - type: object
          required: [totalValueMinor]
          properties:
            totalValueMinor: { type: integer, minimum: 0 }
    InventoryMovementType:
      type: string
      enum: [purchase, sale, return, damage, adjustment]
    InventoryMovement:
      type: object
      required: [id, productId, type, quantity, quantityBefore, quantityAfter, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productNameEn: { type: ["string", "null"] }
        productNameAr: { type: ["string", "null"] }
        type: { $ref: "#/components/schemas/InventoryMovementType" }
        quantity: { type: integer }
        unitCostMinor: { type: ["integer", "null"], minimum: 0 }
        quantityBefore: { type: integer }
        quantityAfter: { type: integer }

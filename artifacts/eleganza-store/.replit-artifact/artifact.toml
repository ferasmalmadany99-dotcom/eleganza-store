kind = "web"
previewPath = "/"
title = "Eleganza Store"
description = "A refined, responsive storefront for Eleganza with curated product discovery, product details, favorites, and a working shopping bag experience."
version = "1.0.0"
id = "artifacts/eleganza-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25719

[services.development]
run = "pnpm --filter @workspace/eleganza-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eleganza-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/eleganza-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25719"
BASE_PATH = "/"

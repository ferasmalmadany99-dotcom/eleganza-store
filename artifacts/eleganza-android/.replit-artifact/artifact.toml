kind = "mobile"
previewPath = "/eleganza-android/"
title = "Eleganza Android"
description = "An Android shopping app for Eleganza customers, with the live catalog, favorites, shopping bag, customer accounts, and cash-on-delivery orders connected to the existing store API."
version = "1.0.0"
id = "artifacts/eleganza-android"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/eleganza-android/" ]
localPort = 24659

[services.development]
run = "pnpm --filter @workspace/eleganza-android run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eleganza-android", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/eleganza-android", "run", "serve" ]

[services.env]
PORT = "24659"
BASE_PATH = "/eleganza-android/"
